name: Gifjar
options:
  bundleIdPrefix: dev.jusso
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gifjar:
    type: application
    platform: iOS
    sources:
      - path: Gifjar
      - path: Shared
    dependencies:
      - target: GifjarShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.gifjar
        CODE_SIGN_ENTITLEMENTS: Gifjar/Resources/Gifjar.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Gifjar/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  GifjarShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.gifjar.share
        PRODUCT_MODULE_NAME: GifjarShare
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  GifjarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GifjarTests
    dependencies:
      - target: Gifjar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.gifjar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gifjar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gifjar"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Gifjar:
    build:
      targets:
        Gifjar: all
    test:
      targets:
        - GifjarTests
